# Serve the built React app. try_files sends unknown paths to
# index.html so React Router can handle /about, /services, etc.
# when someone refreshes the page.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed JS and CSS can be kept in the browser for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Merged service pages. These are permanent so old links keep their rank.
    location = /services/websites { return 301 /services/brand-websites; }
    location = /services/brand-design { return 301 /services/brand-websites; }
    location = /services/automation-ai { return 301 /services/automation-reporting; }
    location = /services/data-growth { return 301 /services/automation-reporting; }

    # A saved page is a folder with index.html, for example
    # /services/brand-websites/index.html. Use that file when it exists.
    # Otherwise fall back to the app shell so the browser can still open the route.
    location / {
        try_files $uri $uri/index.html /index.html;
    }
}
