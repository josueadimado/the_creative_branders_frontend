# Serve the built site. A saved page is a folder with index.html.
# An address that was never published returns the 404 page with status 404.
# The studio desk and the style guide are real app screens, so they still open.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Caddy ends the secure connection, then talks to this server over plain http.
    # A full address built here would start with http://. A short address keeps https://.
    absolute_redirect off;
    port_in_redirect off;

    # Send smaller copies of text files so the first visit finishes sooner.
    gzip on;
    gzip_vary on;
    # The live site sits behind another server. Without this, that hop
    # turns compression off and the homepage stays a large file.
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/html text/plain text/css application/javascript application/json image/svg+xml;

    # Tell the browser how this site is allowed to behave.
    # A location that sets its own add_header must include the file again.
    # nginx does not copy add_header from the server block into that location.
    include /etc/nginx/security-headers.conf;

    # Old addresses from the previous site.
    location = /discover { return 301 /; }
    location = /discover/ { return 301 /; }
    location = /privacy-policy { return 301 /privacy; }
    location = /privacy-policy/ { return 301 /privacy; }

    # Hashed JS and CSS can be kept in the browser for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Open tabs poll this after a deploy and soft-reload when the id changes.
    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Fonts keep a long cache. Work screenshots and logos change under the same path.
    location ~* \.woff2$ {
        expires 365d;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(avif|jpg|jpeg|png|gif|webp|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Old service pages now land on the homepage list. Quote the address so # is not a comment.
    location = /services { return 301 "/#services"; }
    location = /services/ { return 301 "/#services"; }
    location = /services/websites { return 301 "/#services"; }
    location = /services/brand-design { return 301 "/#services"; }
    location = /services/brand-websites { return 301 "/#services"; }
    location = /services/web-applications { return 301 "/#services"; }
    location = /services/mobile-apps { return 301 "/#services"; }
    location = /services/automation-ai { return 301 "/#services"; }
    location = /services/automation-reporting { return 301 "/#services"; }
    location = /services/data-growth { return 301 "/#services"; }

    # These addresses are not pages. If they fall through to the homepage,
    # an agent check reads the wrong file and marks the site as failing.
    location = /.well-known/ai-catalog.json { return 404; }
    location = /ai-catalog.json { return 404; }

    # These product pages are shared by their address before they are listed.
    # A saved copy is used when one exists. Otherwise the app draws the page.
    location = /smartcrm { try_files /smartcrm/index.html /index.html; }
    location = /smartcrm/ { try_files /smartcrm/index.html /index.html; }
    location = /academy { try_files /academy/index.html /index.html; }
    location = /academy/ { try_files /academy/index.html /index.html; }

    # Insights stays open at its address while the notes are drafts.
    # A saved copy is used once three notes are published. Otherwise the app draws the page.
    location = /insights { try_files /insights/index.html /index.html; }
    location /insights/ { try_files $uri $uri/index.html /index.html; }

    # Desk and style guide use the empty SPA shell (spa.html), not the prerendered
    # homepage in index.html — otherwise a reload briefly shows the public site.
    location = /desk {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files /spa.html =404;
    }
    location /desk/ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /spa.html;
    }
    location /dev/ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /spa.html;
    }

    # Only the error page may be served from this file, and only with status 404.
    location = /404.html { internal; }

    # A saved page is a folder with index.html, for example /about/index.html.
    # /about/ becomes /about. The short address stays on https, because of absolute_redirect above.
    # HTML must not stick in the browser for days, or a push looks invisible until a hard refresh.
    location / {
        rewrite ^(.+)/$ $1 permanent;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/index.html =404;
        error_page 404 /404.html;
    }
}
