# Serve the built site. A saved page is a folder with index.html.
# An address that was never published returns the 404 page with status 404.
# The studio desk and the style guide are real app screens, so they still open.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Send smaller copies of text files so the first visit finishes sooner.
    gzip on;
    gzip_vary on;
    # The live site sits behind another server. Without this, that hop
    # turns compression off and the homepage stays a large file.
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/html text/plain text/css application/javascript application/json image/svg+xml;

    # Tell the browser how this site is allowed to behave.
    # A location that sets its own add_header must include the file again.
    # nginx does not copy add_header from the server block into that location.
    include /etc/nginx/security-headers.conf;

    # Old addresses from the previous site.
    location = /discover { return 301 /; }
    location = /discover/ { return 301 /; }
    location = /privacy-policy { return 301 /privacy; }
    location = /privacy-policy/ { return 301 /privacy; }

    # Hashed JS and CSS can be kept in the browser for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Pictures and icons rarely change between deploys, so the browser can keep them.
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff2)$ {
        expires 365d;
        add_header Cache-Control "public" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Old service pages now land on the homepage list. Quote the address so # is not a comment.
    location = /services { return 301 "/#services"; }
    location = /services/websites { return 301 "/#services"; }
    location = /services/brand-design { return 301 "/#services"; }
    location = /services/brand-websites { return 301 "/#services"; }
    location = /services/web-applications { return 301 "/#services"; }
    location = /services/mobile-apps { return 301 "/#services"; }
    location = /services/automation-ai { return 301 "/#services"; }
    location = /services/automation-reporting { return 301 "/#services"; }
    location = /services/data-growth { return 301 "/#services"; }

    # These addresses are not pages. If they fall through to the homepage,
    # an agent check reads the wrong file and marks the site as failing.
    location = /.well-known/ai-catalog.json { return 404; }
    location = /ai-catalog.json { return 404; }

    # The desk and the style guide are not saved as their own HTML files.
    location = /desk { try_files /index.html =404; }
    location /desk/ { try_files $uri $uri/ /index.html; }
    location /dev/ { try_files $uri $uri/ /index.html; }

    # Only the error page may be served from this file, and only with status 404.
    location = /404.html { internal; }

    # A saved page is a folder with index.html, for example /about/index.html.
    location / {
        try_files $uri $uri/index.html =404;
        error_page 404 /404.html;
    }
}
