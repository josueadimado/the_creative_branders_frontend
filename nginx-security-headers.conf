# Sent with every response. Included from each location that sets
# its own add_header, because nginx does not copy those down.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-wadnAEJY5g/LHroyDFRjkGd3ZF0aQ7n5lbGfpOMb+KQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api.thecreativebranders.com; font-src 'self'; connect-src 'self' https://api.thecreativebranders.com; form-action 'self' https://api.thecreativebranders.com; upgrade-insecure-requests" always;
