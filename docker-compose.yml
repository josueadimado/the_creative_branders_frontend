# Local development — this folder only.
# From frontend/:
#   docker compose up --build
#
# Website: http://localhost:3000
# The API is a separate app (backend/). Point VITE_API_URL at it.
#
# Production is docker-compose.prod.yml (Dokploy), not this file.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"

volumes:
  frontend_node_modules:
