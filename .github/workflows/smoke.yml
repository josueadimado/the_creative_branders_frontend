# Tiny check that GitHub is willing to start a job at all.
# The image workflow was failing before any job began, so this file
# has no Docker steps. If this also fails instantly, GitHub is blocking
# the account, not the image file.
name: Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "GitHub started a job."
