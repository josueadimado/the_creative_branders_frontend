# Builds the website image on GitHub. The server only downloads it.
name: Build website image

on:
  push:
    branches: [main]
  # Run it yourself from the Actions tab: Build website image → Run workflow.
  workflow_dispatch:
  # 02:00 GMT every night, so an admin edit reaches the saved pages within a day.
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: website-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  # Lets the build reuse files from the last run, so the next push is faster.
  actions: write

env:
  IMAGE: ghcr.io/josueadimado/the_creative_branders_frontend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      # The plain Docker builder cannot save a cache. This turns on the builder that can.
      - name: Prepare the image builder
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub's image store
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:main
          # These addresses are baked into the pages. A change here needs a new image.
          build-args: |
            VITE_API_URL=https://api.thecreativebranders.com
            VITE_SITE_URL=https://thecreativebranders.com
            VITE_WHATSAPP_NUMBER=${{ vars.VITE_WHATSAPP_NUMBER }}
            VITE_GA_ID=${{ vars.VITE_GA_ID || 'G-NEL0QVQ3YW' }}
          labels: |
            org.opencontainers.image.source=https://github.com/josueadimado/the_creative_branders_frontend
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is published above. This asks Dokploy to download it and restart the site.
      # Add a repository secret named DOKPLOY_DEPLOY_WEBHOOK with the webhook from the frontend service.
      - name: Deploy the new image
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::No DOKPLOY_DEPLOY_WEBHOOK secret. The image was published. Deploy the frontend service in Dokploy so the live site updates."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$WEBHOOK"
