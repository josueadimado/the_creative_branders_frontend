<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The homepage title uses Barlow Condensed. Other page titles use Montserrat. -->
    <link rel="preload" href="/fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/montserrat-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The opening paragraph uses Inter, and that paragraph is the largest text on a phone. -->
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Denied storage choices, before any Google script. The build adds the tag after this when an id is set. -->
    <script src="/consent-defaults.js"></script>
    <meta name="theme-color" content="#0E1E2B" />
    <!-- Same words as site.name and site.tagline. The app replaces this once the page is ready. -->
    <title>The Creative Branders — Designed for Intelligent Growth</title>
    <!-- The production build waits for this to become true before saving the page. -->
    <script>window.prerenderReady = false;</script>
    <link rel="icon" href="/brand/tcb-favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/png/tcb-favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/brand/png/tcb-app-icon-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
