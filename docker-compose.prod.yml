# Production compose for the Hetzner server.
# GitHub Actions builds the image. This file only downloads it.
# Caddy (on the host) sits on the Docker network named web.
# No published ports — Caddy reverse-proxies to the container by name.
services:
  tcb-frontend:
    container_name: tcb-frontend
    image: ghcr.io/josueadimado/the_creative_branders_frontend:main
    pull_policy: always
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - web

networks:
  web:
    external: true
